<!doctype html>
<html lang="en">
  <head>
    <!--
      Content-Security-Policy: defense-in-depth against XSS / credential exfil.
      - default-src 'self': baseline restrictive.
      - script-src 'self': all JS comes from the bundle; no inline / no eval.
      - style-src includes 'unsafe-inline' because Vite injects styles via inline
        <style> tags during dev, and the Tailwind preflight pulls inline rules too.
        Removing 'unsafe-inline' breaks the app's styling system — DO NOT.
      - font-src + style-src include fonts.googleapis.com / fonts.gstatic.com for Geist.
      - connect-src ws://localhost:4455: OBS WebSocket (mandatory).
      - connect-src ws://localhost:5173: Vite HMR (dev-only, harmless in production).
      - Google API origins are NOT in connect-src — all YouTube/OAuth fetches happen
        in the main process via Node fetch, not the renderer.
      - frame-src youtube-nocookie.com + youtube.com: DashScreen embeds the live
        broadcast preview via a YouTube nocookie iframe. Both origins are needed
        because nocookie redirects to www.youtube.com for some player resources.
      - object-src 'none', base-uri 'self': lockdown extras.
      - frame-ancestors is intentionally absent: per CSP spec it's ignored when
        delivered via <meta> (Chromium logs a warning), and the directive is
        moot in Electron — the renderer is always loaded directly into a
        BrowserWindow, never as an iframe in another origin.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws://localhost:4455 ws://localhost:5173; img-src 'self' data: https://lh3.googleusercontent.com https://yt3.ggpht.com https://yt3.googleusercontent.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keshucord</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
